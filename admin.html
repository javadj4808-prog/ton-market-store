<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | TON Market</title><link rel="stylesheet" href="/style.css"><style>.admin{width:min(100% - 24px,1100px);margin:30px auto}.tablewrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:800px;background:#111821;border-radius:12px}th,td{padding:12px;border-bottom:1px solid #263140;text-align:right;font-size:12px;overflow-wrap:anywhere}th{color:#54e0b4}td button{border:0;border-radius:8px;padding:8px;background:#54e0b4;color:#06120e;cursor:pointer}.hidden{display:none}.login{max-width:420px;margin:8vh auto}.status{color:#54e0b4}</style></head><body><header class="top"><a class="logo" href="/">TON<span>MARKET</span></a><span class="secure">مدیریت سفارش‌ها</span></header><main class="admin"><section id="login" class="checkout login"><h2>ورود مدیر</h2><form id="loginForm"><label>رمز عبور مدیر</label><input type="password" id="password" required autocomplete="current-password"><button class="button">ورود</button><p id="loginMessage" class="fine"></p></form></section><section id="ordersSection" class="hidden"><h2>سفارش‌ها</h2><p class="fine">کد فعال‌سازی را از این پنل صادر نمی‌کنیم؛ پس از ارسال دستی کد، وضعیت سفارش را تغییر دهید.</p><button class="button" id="refresh" style="max-width:220px">به‌روزرسانی</button><div class="tablewrap"><table><thead><tr><th>زمان</th><th>شناسه سفارش</th><th>شناسه دستگاه</th><th>موبایل</th><th>مبلغ</th><th>وضعیت</th><th>پیگیری</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div><p id="ordersMessage" class="fine"></p></section></main><script>
let token=sessionStorage.getItem("tonAdminToken")||"";
const login=document.getElementById("login"), section=document.getElementById("ordersSection"), rows=document.getElementById("rows");
function show(){login.classList.toggle("hidden",!!token);section.classList.toggle("hidden",!token);if(token)loadOrders()}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();let m=document.getElementById("loginMessage");try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});let d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem("tonAdminToken",token);show()}catch(x){m.textContent=x.message}});
async function loadOrders(){try{let r=await fetch("/api/admin/orders",{headers:{Authorization:"Bearer "+token}});let d=await r.json();if(!r.ok)throw Error(d.error);rows.innerHTML="";for(let o of d){let tr=document.createElement("tr");let vals=[new Date(o.created_at).toLocaleString("fa-IR"),o.id,o.device_id,o.phone,new Intl.NumberFormat("fa-IR").format(o.amount_toman)+" تومان",o.status,o.ref_id||"—"];for(let v of vals){let td=document.createElement("td");td.textContent=v;tr.appendChild(td)}let td=document.createElement("td");if(o.status==="paid"){let b=document.createElement("button");b.textContent="کد ارسال شد";b.onclick=()=>markSent(o.id);td.appendChild(b)}else td.textContent="—";tr.appendChild(td);rows.appendChild(tr)}document.getElementById("ordersMessage").textContent="آخرین ۵۰۰ سفارش نمایش داده می‌شود."}catch(e){document.getElementById("ordersMessage").textContent=e.message;if(String(e.message).includes("نشست")){token="";sessionStorage.removeItem("tonAdminToken");show()}}}
async function markSent(id){if(!confirm("آیا کد فعال‌سازی را دستی برای مشتری ارسال کرده‌اید؟"))return;let r=await fetch("/api/admin/orders/"+encodeURIComponent(id)+"/sent",{method:"POST",headers:{Authorization:"Bearer "+token}});let d=await r.json();if(!r.ok)alert(d.error);loadOrders()}
document.getElementById("refresh").onclick=loadOrders;show();
</script></body></html>
